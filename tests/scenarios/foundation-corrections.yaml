feature: Glitter Workflow Foundation corrections

description: |
  Source-only corrections to categorized settings, scalar integer normalization,
  public user subjects and seven admin shells. Runtime capture and execution
  remain unimplemented. Test execution requires proven production isolation.

axes:
  setting_key: [max_actions_per_workflow, max_condition_depth, max_workflow_recursion_depth]
  setting_input: [missing, null, valid, above_absolute, negative, string, float, boolean, array, object]
  integer_input: [native, canonical_string, null, invalid, decimal, scientific, whitespace, boolean, float, overflow, array, object]
  board_adapter: [post, comment]
  user_adapter: [registered, updated]
  layout: [admin_workflow_list, admin_workflow_create, admin_workflow_detail, admin_workflow_edit, admin_execution_list, admin_execution_detail, admin_workflow_settings]
  locale: [en, ko]

exclusions:
  - reason: Settings, integer, user identity and layout axes are independent contract families; cross products apply within each family only.
  - reason: The shared integer helper covers the full numeric matrix; board adapter integration separately checks parent and actor numeric strings and invalid parent values.
  - reason: Runtime delivery, action execution, database persistence and installed lifecycle are outside Foundation and are not exercised.

effects:
  - all_operational_limits_are_bounded
  - recursion_is_always_zero
  - missing_and_null_read_as_defaults_but_null_writes_are_rejected
  - partial_writes_preserve_omitted_normalized_values
  - settings_frontend_exposure_is_empty
  - nullable_board_integer_strings_survive_without_unsafe_coercion
  - both_user_subjects_use_public_uuid_without_internal_user_id
  - stable_trigger_action_and_enum_contracts_remain_closed
  - seven_layouts_render_translations_with_current_admin_components
  - seven_layouts_fill_the_current_admin_content_slot

test_files:
  - modules/_bundled/glitter-workflow/tests/Unit/FoundationContractsTest.php
  - modules/_bundled/glitter-workflow/tests/Unit/FoundationLayoutInheritanceTest.php
  - modules/_bundled/glitter-workflow/resources/js/__tests__/layouts/admin_workflow_list.test.tsx
  - modules/_bundled/glitter-workflow/resources/js/__tests__/layouts/admin_workflow_create.test.tsx
  - modules/_bundled/glitter-workflow/resources/js/__tests__/layouts/admin_workflow_detail.test.tsx
  - modules/_bundled/glitter-workflow/resources/js/__tests__/layouts/admin_workflow_edit.test.tsx
  - modules/_bundled/glitter-workflow/resources/js/__tests__/layouts/admin_execution_list.test.tsx
  - modules/_bundled/glitter-workflow/resources/js/__tests__/layouts/admin_execution_detail.test.tsx
  - modules/_bundled/glitter-workflow/resources/js/__tests__/layouts/admin_workflow_settings.test.tsx
